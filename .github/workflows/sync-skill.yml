name: Sync skill from source repo

# Pulls a skill that another team authors in its own public repo (skill.json `source`) and
# opens a PR here. Run it by hand, or from the source repo's release workflow:
#   gh workflow run sync-skill.yml -R getbrevo/brevo-skills -f skill=brevo-cli -f ref=<sha>

on:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill folder under src/skills/, for example brevo-cli'
        required: true
      ref:
        description: "Branch, tag or commit in the source repo. Defaults to skill.json's ref, else main"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-${{ inputs.skill }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SKILL: ${{ inputs.skill }}
      REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # synced content and package scripts never see the token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Check inputs
        run: |
          [[ "$SKILL" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "invalid skill name"; exit 1; }
          [[ -z "$REF" || "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9_./-]*$ ]] || { echo "invalid ref"; exit 1; }
      - name: Sync
        run: |
          if [ -n "$REF" ]; then yarn sync-skill "$SKILL" --ref "$REF"; else yarn sync-skill "$SKILL"; fi
      - name: Build and verify
        env:
          PUBLIC_SAFETY_PATTERNS: ${{ secrets.PUBLIC_SAFETY_PATTERNS }}
        run: yarn build && yarn verify
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Already up to date."
            exit 0
          fi
          SHA=$(node -p "require('./src/skills/$SKILL/skill.json').source.ref.slice(0, 12)")
          BRANCH="sync/$SKILL-$SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(skills): sync $SKILL from source ($SHA)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(skills): sync $SKILL ($SHA)" \
            --body "Synced \`$SKILL\` from its source repo at \`$SHA\` by the sync-skill workflow. Review the skill diff, then bump its \`version\` in \`skill.json\` if its behaviour changed."
