name: Mirror guard

# This repository is a published copy of the Brevo skills source: its content is pushed by the
# source repository's publish pipeline, never by pull request. Every pull request opened here
# is closed with a pointer, so nobody reviews or merges a change that the next publish would
# overwrite. No code from the pull request is checked out or run.
on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  close:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # comment on and close the pull request
    steps:
      - name: Close the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr close "$PR" -R "$REPO" --comment "Thanks for the interest. This repository is a published copy of the Brevo skills source and does not take pull requests; whatever is merged here would be overwritten by the next publish. Please open an issue describing the problem instead, or use the private security advisory form for security reports."
