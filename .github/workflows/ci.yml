name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # check-versions reads catalog.json on the base branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Validate skills and config
        run: yarn validate
      - name: Generated files are up to date
        run: yarn run check
      - name: Manifests match the published schemas
        run: yarn check-schemas
      - name: Changed skills have a new version
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: yarn check-versions --base "origin/$BASE_REF"
      - name: Public-safety check
        env:
          # Internal hosts and service names, kept out of the public code (see the script).
          PUBLIC_SAFETY_PATTERNS: ${{ secrets.PUBLIC_SAFETY_PATTERNS }}
        run: yarn check-public
      - name: Warn when the internal-name list was not available
        # Fork PRs get no secrets, so only the generic rules ran above.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::warning::PUBLIC_SAFETY_PATTERNS is unavailable on fork PRs; a maintainer must run yarn check-public with the internal list before merging."
      - name: Unit tests
        run: yarn test
      - name: Build and package
        run: yarn build && yarn package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/release/
